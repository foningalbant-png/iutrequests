name: Keep Supabase Alive

on:
  schedule:
    # Ping toutes les 24h (midi UTC = 13h Paris = 14h Douala)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permet aussi de lancer manuellement depuis GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase pour eviter la mise en pause
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://yfnipfjbkkkvldbotvtp.supabase.co/rest/v1/departments?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlmbmlwZmpia2trdmxkYm90dnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NzEyOTksImV4cCI6MjA5ODA0NzI5OX0.kfh0xVLiu95uAzzNJIAm6q1HcxlTfrdPUHnPOl_r948" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlmbmlwZmpia2trdmxkYm90dnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NzEyOTksImV4cCI6MjA5ODA0NzI5OX0.kfh0xVLiu95uAzzNJIAm6q1HcxlTfrdPUHnPOl_r948")
          echo "Statut Supabase: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Supabase est actif et repond correctement."
          else
            echo "Attention: Supabase repond avec le code $STATUS"
          fi
