<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IUTRequests - Super Administration">
  <title>IUTRequests - Super Administration</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230D47A1'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='14' fill='white'%3ESA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="stylesheet" href="../assets/css/style.css?v=15">
</head>
<body>
  <div id="app"><div class="loading-page" style="min-height:100vh"><div class="spinner"></div><p>Chargement...</p></div></div>
  <script src="../assets/js/config.js?v=14"></script>
  <script src="../assets/js/i18n.js?v=14"></script>
  <script src="../assets/js/auth.js?v=14"></script>
  <script>
  const SA = {
    init() {
      document.documentElement.setAttribute('data-theme', localStorage.getItem('iut-theme') || 'light');
      window.addEventListener('hashchange', () => this.route());
      this.route();
    },

    async route() {
      const hash = location.hash.slice(1) || '/';
      const user = Auth.getUser();
      if (hash === '/login' || !user || user.role !== 'SUPER_ADMIN') {
        if (hash !== '/login' && (!user || user.role !== 'SUPER_ADMIN')) { this.showLogin(); return; }
        if (hash === '/login') { this.showLogin(); return; }
      }
      let unreadCount = 0;
      try { unreadCount = await NotifStore.getUnreadCount(user.id); } catch(e) {}
      const path = hash.split('?')[0];
      document.getElementById('app').innerHTML = this.layout('<div class="loading-page"><div class="spinner"></div><p>Chargement...</p></div>', path, unreadCount);
      let c = '';
      switch (path) {
        case '/': case '/dashboard': c = await this.pgDash(); break;
        case '/requests': c = await this.pgReqs(); break;
        case '/departments': c = await this.pgDepts(); break;
        case '/programs': c = await this.pgProgs(); break;
        case '/categories': c = await this.pgCats(); break;
        case '/admins': c = await this.pgAdmins(); break;
        case '/superadmins': c = await this.pgSuperAdmins(); break;
        case '/users': c = await this.pgUsers(); break;
        case '/audit': c = this.pgAudit(); break;
        case '/faq': c = await this.pgFaq(); break;
        case '/notifications': c = await this.pgNotifs(); break;
        case '/profile': c = this.pgProfile(); break;
        default:
          if (path.startsWith('/requests/')) c = await this.pgReqDetail(path.split('/')[2]);
          else c = '<div class="empty-state mt-4"><h2>Page non trouvÃ©e</h2></div>';
      }
      document.getElementById('app').innerHTML = this.layout(c, path, unreadCount);
      window.scrollTo(0, 0);
    },

    layout(content, path, unread = 0) {
      const user = Auth.getUser();
      const links = [
        {p:'/dashboard',l:'Tableau de bord',i:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>'},
        {p:'/requests',l:'Toutes les requÃªtes',i:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>'},
        {s:'Administration'},
        {p:'/departments',l:'DÃ©partements',i:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>'},
        {p:'/programs',l:'FiliÃ¨res',i:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>'},
        {p:'/categories',l:'CatÃ©gories',i:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>'},
        {p:'/admins',l:'Administrateurs',i:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>'},
        {p:'/superadmins',l:'Super Admins',i:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>'},
        {p:'/users',l:'Tous les comptes',i:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>'},
        {p:'/audit',l:'Journal d\'audit',i:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>'},
        {p:'/faq',l:'FAQ dynamique',i:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'},
        {s:'Personnel'},
        {p:'/notifications',l:'Notifications',i:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg>'},
        {p:'/profile',l:'Mon profil',i:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'},
      ];
      return `
      <header class="header"><div class="header-inner">
        <div class="header-left">
          <button class="header-btn mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
          <a class="header-logo" href="#/dashboard"><img src="../assets/images/logo.png" alt="IUT" onerror="this.style.display='none'"><span class="header-logo-text">IUTRequests <span style="font-size:11px;opacity:0.8;font-weight:400;background:var(--primary);padding:2px 8px;border-radius:4px;margin-left:4px">Super Admin</span></span></a>
        </div>
        <div class="header-right">
          <button class="header-btn" onclick="SA.toggleTheme()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${document.documentElement.getAttribute('data-theme')==='dark'?'<circle cx="12" cy="12" r="5"/>':'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'}</svg></button>
          <a href="#/notifications" class="header-btn">${unread>0?'<span class="header-badge-count">'+unread+'</span>':''}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg></a>
          <div class="user-menu"><button class="user-menu-trigger" onclick="this.nextElementSibling.classList.toggle('hidden')"><div class="user-avatar">${user.firstName?.[0]||'S'}${user.lastName?.[0]||'A'}</div><span class="user-name">${user.firstName}</span></button>
            <div class="dropdown hidden"><div class="dropdown-header"><div class="dropdown-header-name">${user.firstName} ${user.lastName}</div><div class="dropdown-header-email">${user.email}</div></div><a href="#/profile" class="dropdown-item" onclick="document.querySelectorAll('.dropdown').forEach(d=>d.classList.add('hidden'))">Profil</a><div class="dropdown-divider"></div><button class="dropdown-item dropdown-item-danger" onclick="Auth.logout();location.hash='#/login'">DÃ©connexion</button></div>
          </div>
        </div>
      </div></header>
      <aside class="sidebar" id="sidebar"><nav class="sidebar-nav">
        ${links.map(l=>{if(l.s)return '<div class="sidebar-section">'+l.s+'</div>';const a=path===l.p||(l.p!=='/dashboard'&&path.startsWith(l.p));return '<a href="#'+l.p+'" class="sidebar-link '+(a?'active':'')+'" onclick="document.getElementById(\'sidebar\').classList.remove(\'open\')">'+l.i+' '+l.l+'</a>'}).join('')}
      </nav></aside>
      <main class="main-content main-with-sidebar">${content}</main>
      <div id="toast-container" class="toast-container"></div><div id="modal-root"></div>`;
    },

    showLogin() {
      document.getElementById('app').innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-alt);padding:20px">
        <div style="width:100%;max-width:440px">
          <div style="text-align:center;margin-bottom:28px">
            <div style="width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#0D47A1,#1565C0);display:flex;align-items:center;justify-content:center;margin:0 auto 16px"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></div>
            <h1 style="font-size:1.5rem;font-family:Poppins,sans-serif;font-weight:700">Super Administration</h1>
            <p style="color:var(--text-secondary);font-size:14px;margin-top:4px">AccÃ¨s rÃ©servÃ© au Super Administrateur</p>
          </div>
          <div class="card">
            <form onsubmit="return SA.handleLogin(event)">
              <div class="form-group"><label class="form-label">Adresse e-mail</label><input type="email" class="form-input" id="sa-email" required placeholder="votre@email.com"></div>
              <div class="form-group"><label class="form-label">Mot de passe</label><input type="password" class="form-input" id="sa-password" required></div>
              <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Connexion</button>
            </form>
          </div>
          <p style="text-align:center;font-size:13px;color:var(--text-muted);margin-top:16px"><a href="../index.html" style="color:var(--primary)">Retour au site principal</a></p>
        </div>
      </div><div id="toast-container" class="toast-container"></div>`;
    },

    async handleLogin(e) {
      e.preventDefault();
      const r = await Auth.loginSuperAdmin(document.getElementById('sa-email').value, document.getElementById('sa-password').value);
      if (r.success) { Auth.addAudit('CONNEXION','Super Admin connecte'); location.hash='#/dashboard'; this.route(); }
      else Utils.toast(r.message,'error');
      return false;
    },

    toggleTheme() { const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',t); localStorage.setItem('iut-theme',t); this.route(); },

    modal(title,body,footer,lg) {
      document.getElementById('modal-root').innerHTML='<div class="modal-overlay" onclick="if(event.target===this)document.getElementById(\'modal-root\').innerHTML=\'\'"><div class="modal '+(lg?'modal-lg':'')+'"><div class="modal-header"><span class="modal-title">'+title+'</span><button class="modal-close" onclick="document.getElementById(\'modal-root\').innerHTML=\'\'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div class="modal-body">'+body+'</div><div class="modal-footer">'+footer+'</div></div></div>';
    },
    closeModal() { document.getElementById('modal-root').innerHTML=''; },

    addAudit(action, details) {
      const logs = JSON.parse(localStorage.getItem('iut-audit')||'[]');
      const u = Auth.getUser();
      logs.unshift({ id:'log-'+Date.now(), date:new Date().toISOString(), user:(u?(u.first_name||'')+' '+(u.last_name||''):'Systeme'), userEmail:u?.email||'', action:action, details:details });
      if (logs.length > 500) logs.length = 500;
      localStorage.setItem('iut-audit', JSON.stringify(logs));
    },

    async getDepts() {
      try {
        const rows = await SB.select('departments', null, 'sort_order.asc,name.asc');
        if (rows && rows.length) return rows.map(d => ({ id: d.id, name: d.name, code: d.code, headName: d.head_name || '', active: d.is_active }));
      } catch(e) {}
      return CONFIG.DEPARTMENTS.map((x, i) => ({ ...x, id: 'dept-' + i, headName: '', active: true }));
    },
    async getProgs() {
      try {
        const rows = await SB.query('programs', 'GET', { filter: 'select=*,departments(code)', order: 'sort_order.asc,name.asc' });
        if (rows && rows.length) return rows.map(p => ({ id: p.id, name: p.name, code: p.code, dept: p.departments?.code || '', headName: p.head_name || '' }));
      } catch(e) {}
      return [];
    },
    async getCats() {
      try {
        const rows = await SB.select('request_categories', null, 'sort_order.asc,name.asc');
        if (rows && rows.length) return rows.map(c => ({ id: c.id, name: c.name, desc: c.description || '', instructions: c.instructions || '', bodyTemplate: c.body_template || '', requiredDocuments: c.required_documents || '' }));
      } catch(e) {}
      return CONFIG.CATEGORIES.map(c => ({ ...c, desc: c.desc || '', instructions: '', bodyTemplate: '', requiredDocuments: '' }));
    },

    /* ===================== DASHBOARD ===================== */
    async pgDash() {
      const reqs=await RequestStore.getAll(); const allU=await Auth.getAllUsers(); const students=allU.filter(u=>u.role==='STUDENT').length; const admins=allU.filter(u=>u.role==='ADMIN').length;
      const pending=reqs.filter(r=>['SUBMITTED','RECEIVED'].includes(r.status)).length;
      const byStatus={}; reqs.forEach(r=>{byStatus[r.status]=(byStatus[r.status]||0)+1;});
      const byCat={}; reqs.forEach(r=>{const n=r.category_name||'Autre';byCat[n]=(byCat[n]||0)+1;});
      const oldest=reqs.filter(r=>['SUBMITTED','RECEIVED','IN_PROGRESS'].includes(r.status)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).slice(0,5);

      return `
      <div class="page-header"><h1 class="page-title">Tableau de bord global</h1></div>
      <div class="stats-grid mb-3">
        <div class="card stat-card"><div class="stat-icon" style="background:var(--primary-light);color:var(--primary)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg></div><div><div class="stat-value">${reqs.length}</div><div class="stat-label">Total requÃªtes</div></div></div>
        <div class="card stat-card"><div class="stat-icon" style="background:var(--yellow-light);color:var(--yellow-dark)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div><div class="stat-value">${pending}</div><div class="stat-label">En attente</div></div></div>
        <div class="card stat-card"><div class="stat-icon" style="background:var(--green-light);color:var(--green)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div><div class="stat-value">${students}</div><div class="stat-label">Ã‰tudiants</div></div></div>
        <div class="card stat-card"><div class="stat-icon" style="background:#F3E5F5;color:#7B1FA2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div><div><div class="stat-value">${admins}</div><div class="stat-label">Administrateurs</div></div></div>
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:16px">
        <div class="card"><div class="card-header"><span class="card-title">RÃ©partition par statut</span></div>
          ${Object.keys(byStatus).length>0?Object.entries(byStatus).map(([s,c])=>'<div class="flex items-center justify-between" style="padding:6px 0">'+Utils.statusBadge(s)+'<span class="fw-600">'+c+'</span></div>').join(''):'<p class="text-muted">Aucune donnÃ©e</p>'}
        </div>
        <div class="card"><div class="card-header"><span class="card-title">RÃ©partition par catÃ©gorie</span></div>
          ${Object.keys(byCat).length>0?Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([n,c])=>'<div class="flex items-center justify-between" style="padding:6px 0"><span style="font-size:13px">'+Utils.escapeHtml(n)+'</span><span class="fw-600">'+c+'</span></div>').join(''):'<p class="text-muted">Aucune donnÃ©e</p>'}
        </div>
      </div>
      ${oldest.length>0?'<div class="card mt-3"><div class="card-header"><span class="card-title" style="color:var(--yellow-dark)">RequÃªtes en attente les plus anciennes</span><a href="#/requests" class="btn btn-ghost btn-sm">Tout voir</a></div><div class="table-container"><table><thead><tr><th>RÃ©fÃ©rence</th><th>Objet</th><th>Ã‰tudiant</th><th>Statut</th><th>Date</th></tr></thead><tbody>'+oldest.map(r=>'<tr style="cursor:pointer" onclick="location.hash=\'#/requests/'+r.id+'\'"><td class="font-mono text-primary" style="font-size:13px">'+r.reference_number+'</td><td>'+Utils.escapeHtml(r.title)+'</td><td class="text-muted" style="font-size:13px">'+(r.student_name||'')+'</td><td>'+Utils.statusBadge(r.status)+'</td><td class="text-muted" style="font-size:13px">'+Utils.formatDate(r.created_at)+'</td></tr>').join('')+'</tbody></table></div></div>':''}`;
    },

    /* ===================== REQUETES + RECHERCHE ===================== */
    filterReqs(q) {
      localStorage.setItem('sa-search', q);
      const lower = q.toLowerCase();
      const rows = document.querySelectorAll('#sa-reqs-tbody tr[data-search]');
      let visible = 0;
      rows.forEach(row => {
        const match = !lower || row.dataset.search.includes(lower);
        row.style.display = match ? '' : 'none';
        if (match) visible++;
      });
      const counter = document.getElementById('sa-reqs-count');
      const empty = document.getElementById('sa-reqs-empty');
      const clearBtn = document.getElementById('sa-reqs-clear');
      if (counter) counter.textContent = 'Toutes les requÃªtes (' + visible + ')';
      if (empty) empty.style.display = visible === 0 ? '' : 'none';
      if (clearBtn) clearBtn.style.display = q ? '' : 'none';
    },
    clearReqsFilter() {
      const input = document.getElementById('sa-search');
      if (input) input.value = '';
      this.filterReqs('');
    },
    async pgReqs() {
      const all=(await RequestStore.getAll()).slice().reverse();
      return `
      <div class="page-header"><h1 id="sa-reqs-count" class="page-title">Toutes les requÃªtes (${all.length})</h1></div>
      <div class="card">
        <div class="filters">
          <div class="search-wrapper"><input type="text" class="form-input" id="sa-search" placeholder="Rechercher par rÃ©fÃ©rence, objet ou Ã©tudiant..." oninput="SA.filterReqs(this.value)" onkeydown="if(event.key==='Enter')SA.filterReqs(this.value)"><button class="search-btn" onclick="SA.filterReqs(document.getElementById('sa-search').value)" title="Rechercher"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button></div>
          <button id="sa-reqs-clear" class="btn btn-ghost btn-sm" style="display:none" onclick="SA.clearReqsFilter()">RÃ©initialiser</button>
        </div>
        <div class="table-container"><table><thead><tr><th>RÃ©fÃ©rence</th><th>Objet</th><th>Ã‰tudiant</th><th>Dept</th><th>CatÃ©gorie</th><th>Statut</th><th>Date</th></tr></thead><tbody id="sa-reqs-tbody">${all.map(r=>'<tr style="cursor:pointer" onclick="location.hash=\'#/requests/'+r.id+'\'" data-search="'+((r.reference_number||'')+' '+(r.title||'')+' '+(r.student_name||'')+' '+(r.department||'')+' '+(r.category_name||'')).toLowerCase().replace(/"/g,'')+'"><td class="font-mono text-primary" style="font-size:13px">'+r.reference_number+'</td><td>'+Utils.escapeHtml(r.title)+'</td><td class="text-secondary" style="font-size:13px">'+(r.student_name||'')+'</td><td class="text-muted" style="font-size:13px">'+(r.department||'')+'</td><td class="text-secondary" style="font-size:13px">'+(r.category_name||'')+'</td><td>'+Utils.statusBadge(r.status)+'</td><td class="text-muted" style="font-size:13px">'+Utils.formatDate(r.created_at)+'</td></tr>').join('')}</tbody></table></div>
        <div id="sa-reqs-empty" class="empty-state" style="display:${all.length===0?'':'none'}"><p>Aucune requÃªte</p></div>
      </div>`;
    },

    async pgReqDetail(id) {
      const req=await RequestStore.getById(id);
      if(!req) return '<div class="empty-state"><h2>RequÃªte non trouvÃ©e</h2><a href="#/requests" class="btn btn-primary mt-2">Retour</a></div>';

      return `

    async showFaqForm(id) {

        } catch(e) {}

      this.modal(f?'Modifier la question':'Nouvelle question',

    async saveFaq(id) {
      const question = (document.getElementById('faq-q').value||'').trim();
      const answer = (document.getElementById('faq-a').value||'').trim();
      if (!question || !answer) { Utils.toast('Question et réponse requises', 'error'); return; }
      try {
        if (id) {
          await SB.update('faqs', 'id=eq.'+id, { question, answer });
        } else {
          await SB.insert('faqs', { question, answer, is_active: true, sort_order: 0 });
        }
        this.closeModal();
        Utils.toast('Enregistré avec succès', 'success');
        this.route();
      } catch(e) {
        Utils.toast('Erreur lors de l\'enregistrement', 'error');
      }
    },
    async deleteFaq(id) {
      if (!confirm('Supprimer cette question ?')) return;
      try {
        await SB.delete('faqs', 'id=eq.'+id);
        Utils.toast('Question supprimée', 'success');
        this.route();
      } catch(e) {
        Utils.toast('Erreur lors de la suppression', 'error');
      }
    },
